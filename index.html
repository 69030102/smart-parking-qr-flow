<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART PARKING — รับบัตรจอดรถ</title>

<!-- PyScript Core Engine -->
<link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --charcoal:#242424;
    --midgray:#898989;
    --white:#ffffff;
    --ring: rgba(34,42,53,0.08);
    --shadow-card:
      rgba(19,19,22,0.7) 0px 1px 5px -4px,
      rgba(34,42,53,0.08) 0px 0px 0px 1px,
      rgba(34,42,53,0.05) 0px 4px 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--white);
    color:var(--charcoal);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
  }
  .app{ width:100%; max-width:440px; }
  .brand{ text-align:center; margin-bottom:28px; position:relative; }
  .brand .logo{ font-weight:700; font-size:22px; color:var(--charcoal); }
  .brand .logo span{ color:var(--midgray); font-weight:500; }

  .card{
    background:var(--white);
    border-radius:16px;
    box-shadow:var(--shadow-card);
    padding:32px 28px;
    margin-bottom:20px;
  }
  h1{ font-size:24px; font-weight:700; line-height:1.3; margin:0 0 6px 0; }
  .sub{ font-size:14px; color:var(--midgray); line-height:1.5; margin:0 0 24px 0; }

  .qr-wrap{
    display:flex; justify-content:center; padding:20px;
    background:var(--white); border-radius:12px;
    box-shadow: var(--ring) 0px 0px 0px 1px; margin-bottom:20px;
  }
  #qrcode img, #qrcode canvas{ border-radius:6px; }

  .row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-top:1px solid rgba(34,42,53,0.08);
  }
  .row:first-of-type{ border-top:none; }
  .row .label{ font-size:13px; color:var(--midgray); font-weight:500; }
  .row .value{ font-size:14px; color:var(--charcoal); font-weight:600; font-family:'Roboto Mono',monospace; }

  .btn{
    width:100%; display:block; text-align:center; padding:13px 18px;
    border-radius:8px; font-size:15px; font-weight:600; border:none;
    cursor:pointer; text-decoration:none; transition:opacity .15s ease;
  }
  .btn:hover{ opacity:0.72; }
  .btn-primary{ background:var(--charcoal); color:var(--white); }

  .badge{
    display:inline-block; font-size:11px; font-weight:600;
    color:var(--midgray); background:#f5f5f5; padding:4px 10px;
    border-radius:9999px; margin-bottom:14px;
  }
  .badge.ok{ color:#0a7d3c; background:#eaf7ee; }

  .footnote{ text-align:center; font-size:12px; color:var(--midgray); margin-top:18px; line-height:1.6; }
  .error{ text-align:center; padding:40px 20px; }
  .error h1{ color:#c0392b; }

  @keyframes qrPopIn{
    from{ opacity:0; transform:scale(.82); }
    to{ opacity:1; transform:scale(1); }
  }
  .qr-pop{ animation: qrPopIn .45s cubic-bezier(.34,1.56,.64,1) both; }

  .lang-toggle{
    position:absolute; top:2px; right:0;
    display:inline-flex; align-items:center; gap:5px;
    background:#f5f5f5; border:none; border-radius:9999px;
    padding:7px 12px; cursor:pointer; font-size:12px; font-weight:700; color:var(--charcoal);
  }
  .lang-toggle svg{ width:14px; height:14px; }

  .staff-link{
    display:block; text-align:center; font-size:12px; color:var(--midgray);
    text-decoration:none; margin-top:14px; font-weight:500;
  }
  .staff-link:hover{ color:var(--charcoal); }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <button class="lang-toggle" id="langToggle" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"></path>
      </svg>
      <span id="langLabel">EN</span>
    </button>
    <div class="logo">SMART <span>PARKING</span></div>
  </div>
  <div id="view"></div>
</div>

<!-- ==================== PYTHON CORE ENGINE ==================== -->
<script type="py">
import time
import random

def gen_ticket_id_py():
    t_ms = int(time.time() * 1000)
    t_hex = hex(t_ms)[2:].upper()
    rand_suffix = format(random.randint(0, 255), '02X')
    return "P-" + t_hex[-6:] + rand_suffix
</script>

<!-- ==================== HIGH-PERFORMANCE JS FLOW ENGINE ==================== -->
<script>
const CONFIG = {
  FREE_MINUTES: 60,
  RATE_PER_HOUR: 20,
  CURRENCY: "฿"
};

let LANG = "th";

const STR = {
  th: {
    home_badge: "จุดรับรถเข้า",
    home_title: "สแกน QR เพื่อรับบิลจอดรถ",
    home_sub: "ใช้กล้องมือถือสแกนโค้ดด้านล่าง ระบบจะออกบิลจอดรถให้ทันทีตามเวลาที่สแกน",
    ticket_badge: "เข้าจอดแล้ว",
    ticket_title: "บัตรจอดรถของคุณ",
    ticket_sub: "เก็บหน้านี้ไว้ หรือบันทึกเป็นรูปภาพ แสดง QR ด้านล่างตอนออกจากลานจอด",
    label_id: "หมายเลขบัตร",
    label_checkin: "เวลาเข้าจอด",
    ticket_qr_note: "แสดง QR นี้ให้เครื่องสแกนตอนออก",
    save_ticket_btn: "บันทึกบัตรลงมือถือ",
    footnote: h => `ชั่วโมงแรกฟรี จากนั้นคิด ${CONFIG.CURRENCY}${h} ต่อชั่วโมง`,
    not_found_title: "ไม่พบข้อมูลบัตร",
    not_found_sub: "ลิงก์นี้ไม่ถูกต้องหรือหมดอายุ",
    back_home: "กลับหน้าแรก",
    staff_link: "สำหรับเจ้าหน้าที่ (สแกนออก) →"
  },
  en: {
    home_badge: "Entry point",
    home_title: "Scan the QR to get a parking ticket",
    home_sub: "Use your phone camera to scan the code below. A ticket will be issued instantly.",
    ticket_badge: "Checked in",
    ticket_title: "Your parking ticket",
    ticket_sub: "Keep this page, or save it as an image. Show the QR below when you leave.",
    label_id: "Ticket No.",
    label_checkin: "Check-in time",
    ticket_qr_note: "Show this QR to the scanner when you exit",
    save_ticket_btn: "Save ticket to phone",
    footnote: h => `First hour free, then ${CONFIG.CURRENCY}${h} per hour`,
    not_found_title: "Ticket not found",
    not_found_sub: "This link is invalid or expired.",
    back_home: "Back to home",
    staff_link: "Staff exit scanner →"
  }
};

function tr(k, ...args){
  const v = STR[LANG][k];
  return typeof v === "function" ? v(...args) : v;
}

function dtLocale(){ return LANG === "th" ? "th-TH" : "en-GB"; }

function fmtDateTime(ms){
  return new Date(ms).toLocaleString(dtLocale(), {
    day:'2-digit', month:'2-digit', year:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: false
  });
}

function playDing(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(1318.51, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.55);
  }catch(e){}
}

function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

function parseHash(){
  const hash = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = hash.split("?");
  const params = new URLSearchParams(qs || "");
  return { path: path || "/", params };
}

function buildUrl(path, params){
  const qs = new URLSearchParams(params).toString();
  return location.origin + location.pathname + "#" + path + (qs ? "?" + qs : "");
}

function render(){
  const { path, params } = parseHash();
  const view = document.getElementById("view");
  view.innerHTML = "";

  if(path === "/") renderHome(view);
  else if(path === "/checkin") handleCheckin();
  else if(path === "/ticket") renderTicket(view, params);
  else renderNotFound(view);
}

function renderHome(view){
  view.innerHTML = `
    <div class="card">
      <span class="badge">${tr('home_badge')}</span>
      <h1>${tr('home_title')}</h1>
      <p class="sub">${tr('home_sub')}</p>
      <div class="qr-wrap qr-pop" id="qrcode"></div>
      <a class="staff-link" href="exit-scan.html">${tr('staff_link')}</a>
    </div>
  `;
  const url = buildUrl("/checkin", {});
  new QRCode(document.getElementById("qrcode"), { text: url, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
}

function handleCheckin(){
  let ticketId = "";
  try {
    if(window.pyscript && pyscript.interpreter && pyscript.interpreter.globals){
      const pyGen = pyscript.interpreter.globals.get('gen_ticket_id_py');
      ticketId = pyGen();
    }
  } catch(e) {}
  
  if(!ticketId){
    const randSuffix = Math.random().toString(36).slice(2, 4).toUpperCase();
    ticketId = "P-" + Date.now().toString(36).toUpperCase().slice(-6) + randSuffix;
  }

  const t = Date.now();
  location.replace(buildUrl("/ticket", { id: ticketId, t }));
}

function renderTicket(view, params){
  const id = params.get("id");
  const t = Number(params.get("t"));
  if(!id || !t) return renderNotFound(view);

  view.innerHTML = `
    <div class="card" id="ticketCard">
      <span class="badge ok">${tr('ticket_badge')}</span>
      <h1>${tr('ticket_title')}</h1>
      <p class="sub">${tr('ticket_sub')}</p>
      <div class="row"><span class="label">${tr('label_id')}</span><span class="value">${id}</span></div>
      <div class="row"><span class="label">${tr('label_checkin')}</span><span class="value">${fmtDateTime(t)}</span></div>
      <div class="qr-wrap qr-pop" id="qrcode" style="margin-top:20px;"></div>
      <p class="sub" style="margin:14px 0 0 0; text-align:center;">${tr('ticket_qr_note')}</p>
    </div>
    <button class="btn btn-primary no-print" id="saveBtn">${tr('save_ticket_btn')}</button>
    <p class="footnote">${tr('footnote', CONFIG.RATE_PER_HOUR)}</p>
  `;

  const checkoutUrl = buildUrl("/checkout", { id, t });
  new QRCode(document.getElementById("qrcode"), { text: checkoutUrl, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });

  playDing();
  vibrate(60);

  document.getElementById("saveBtn").onclick = () => {
    html2canvas(document.getElementById("ticketCard"), { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
      const link = document.createElement("a");
      link.download = "parking-ticket-" + id + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  };
}

function renderNotFound(view){
  view.innerHTML = `
    <div class="card error">
      <h1>${tr('not_found_title')}</h1>
      <p class="sub">${tr('not_found_sub')}</p>
      <a class="btn btn-primary" href="#/">${tr('back_home')}</a>
    </div>
  `;
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", () => {
  const langLabel = document.getElementById("langLabel");
  const langToggle = document.getElementById("langToggle");
  if(langToggle){
    langToggle.onclick = () => {
      LANG = LANG === "th" ? "en" : "th";
      if(langLabel) langLabel.textContent = LANG === "th" ? "EN" : "TH";
      render();
    };
  }
  if(!location.hash) location.hash = "/";
  render();
});
</script>
</body>
</html>
